<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大心社區｜連續掃碼測試</title>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 12px;
    background: #f3f6fa;
    color: #243449;
    font-family: Arial, sans-serif;
    text-align: center;
  }
  h2 { margin-bottom: 8px; }
  .sub { color: #68788b; font-size: 14px; }
  #reader {
    position: relative;
    max-width: 440px;
    margin: 18px auto;
    background: #111;
    border-radius: 12px;
    overflow: hidden;
  }
  video { display: block; width: 100%; }
  button {
    border: 0;
    border-radius: 9px;
    background: #1769aa;
    color: white;
    padding: 13px 20px;
    margin: 5px;
    font-size: 16px;
  }
  button:disabled { background: #9aa7b5; }
  #status {
    max-width: 440px;
    margin: 15px auto;
    padding: 14px;
    border-radius: 9px;
    background: white;
    overflow-wrap: anywhere;
  }
  .success { background: #d9f5e2 !important; }
  .error { background: #ffe1e1 !important; }
  #count { font-weight: bold; font-size: 19px; }
</style>
</head>
<body>
<h2>大心社區｜連續掃碼測試</h2>
<div class="sub">第二階段：測試手機連續辨識 QR Code</div>

<div id="reader">
  <video id="video" autoplay muted playsinline></video>
</div>

<button id="startBtn" onclick="startScanner()">開啟相機</button>
<button id="stopBtn" onclick="stopScanner()" disabled>關閉相機</button>

<div id="status">尚未開啟相機</div>
<div id="count">成功辨識：0 次</div>
<p class="sub">測試版不會寫入任何報到資料</p>

<script>
let stream = null;
let running = false;
let count = 0;
let lastValue = "";
let lastTime = 0;
let frameId = null;

const video = document.getElementById("video");
const statusBox = document.getElementById("status");
const startBtn = document.getElementById("startBtn");
const stopBtn = document.getElementById("stopBtn");
const canvas = document.createElement("canvas");
const ctx = canvas.getContext("2d", { willReadFrequently: true });

function showStatus(message, type = "") {
  statusBox.textContent = message;
  statusBox.className = type;
}

async function startScanner() {
  if (running) return;

  if (typeof jsQR !== "function") {
    showStatus("QR 辨識程式未載入，請檢查網路連線", "error");
    return;
  }

  startBtn.disabled = true;
  showStatus("正在開啟相機……");

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: { ideal: "environment" },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    video.srcObject = stream;
    await video.play();

    running = true;
    stopBtn.disabled = false;
    showStatus("相機已開啟，請掃描 QR Code", "success");
    scanFrame();
  } catch (err) {
    showStatus("相機啟動失敗：" + err.message, "error");
    startBtn.disabled = false;
    if (stream) {
      stream.getTracks().forEach(track => track.stop());
      stream = null;
    }
  }
}

function scanFrame() {
  if (!running) return;

  if (video.readyState >= 2 &&
      video.videoWidth > 0 &&
      video.videoHeight > 0) {
    try {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const imageData = ctx.getImageData(
        0, 0, canvas.width, canvas.height
      );

      const result = jsQR(
        imageData.data,
        imageData.width,
        imageData.height,
        { inversionAttempts: "attemptBoth" }
      );

      if (result && result.data) {
        onScanSuccess(result.data);
      }
    } catch (err) {
      showStatus("辨識發生錯誤：" + err.message, "error");
      stopScanner();
      return;
    }
  }

  frameId = requestAnimationFrame(scanFrame);
}


function onScanSuccess(value) {
  const now = Date.now();

  if (value === lastValue && now - lastTime < 3000) {
    return;
  }

  lastValue = value;
  lastTime = now;
  count++;

  document.getElementById("count").textContent =
    "成功辨識：" + count + " 次";

  showStatus("QR Code 已辨識，等待測試報到連線", "success");

  let token = "";
  try {
    const url = new URL(value);
    token = url.searchParams.get("t") || "";
  } catch (error) {
    showStatus("QR Code 不是有效的報到網址");
    return;
  }

  if (!/^[a-f0-9]{32}$/.test(token)) {
    showStatus("QR Code 識別碼格式不正確");
    return;
  }

  showStatus("測試 QR Code 格式正確，尚未送出報到", "success");
}


function stopScanner() {
  running = false;

  if (frameId !== null) {
    cancelAnimationFrame(frameId);
    frameId = null;
  }

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  video.pause();
  video.srcObject = null;

  startBtn.disabled = false;
  stopBtn.disabled = true;
  showStatus("相機已關閉");
}
</script>
<p id="bridgeStatus">Google 連線：等待回應中</p>
<script>
window.addEventListener("message", function(event) {
  if (event.data && event.data.type === "TEST_BRIDGE_READY") {
    document.getElementById("bridgeStatus").textContent =
      "Google 連線：已收到橋接回應";
  }
});
</script>
</body>
</html>
